# 云效 Flow 流水线参考配置 — Kiro MR 自动评审
#
# 本文件为「2026-07-23 客户中心站环境端到端联调通过」的实测配置骨架。
# 与 pipeline/setup-guide.md、docs 中的示例保持一致口径。
#
# 安全架构（必读）：
# - business_repo 是被评审对象（MR 触发时 Flow checkout 其源分支）——【不受信数据】。
# - integration_repo 是本集成包（固定分支/tag）——【受信脚本来源】。
# - 只执行 integration_repo 中的脚本；绝不执行 business_repo 中的任何脚本，
#   否则 MR 作者可修改脚本窃取流水线密钥。
#
# 并发度（必做，只能在 UI 配）：「触发设置 → 并发度限制」→ 并发运行实例数 = 1。
# YAML 侧没有对应字段（官方语法的顶层节点只有 name/sources/stages 与 defaultWorkspace、mountDirs 等，
# 不含并发度），所以粘贴本文件之后仍要去 UI 勾一次。不设的话同一 MR 连推两次会并行跑两个运行，
# 汇总评论互相覆盖（丢结论与历次记录）、行内草稿互删（同一问题出现两份）——详见 setup-guide 第 4 节第 4 步。
#
# 变量 KIRO_API_KEY / YUNXIAO_TOKEN 必须在 UI「变量和缓存」配置为私密变量，不要写入本文件。
# 使用前替换 <...> 占位：两个 endpoint、以及 serviceConnection（首次在 YAML 编辑器粘贴后，
# 校验器会识别并回填你组织的服务连接 ID）。
sources:
  business_repo:
    type: codeup
    name: 业务代码库（被评审对象，不受信）
    endpoint: https://codeup.aliyun.com/<organization-id>/<business-repo>.git
    branch: master                      # 默认分支；MR 触发时 Flow 自动使用源分支
    triggerEvents:
      - mergeRequestOpenedOrUpdate       # 必须显式声明，否则代码源事件不触发流水线
    certificate:
      type: serviceConnection
      serviceConnection: "<service-connection-id>"
  integration_repo:
    type: codeup
    name: 集成包仓库（受信脚本来源）
    endpoint: https://codeup.aliyun.com/<organization-id>/<integration-repo>.git
    # Flow 的 sources 只有 branch 字段、没有 tag 字段（2026-09-11 核对官方 YAML 语法文档），所以「集成包固定到 tag」
    # 只能用两种形态之一，见 setup-guide §2：① 这里指向一个受保护的发布分支（如 release），由人按版本快进到已验收的 tag；
    # ② 每次运行经 OpenAPI CreatePipelineRun 的 runningBranchs 显式指定 tag（tag 可以作运行 ref）。
    # 自动触发（MR 新建 / 推送）走的是这里的 branch，所以生产必须让这个分支只能由发布流程推动。
    branch: main
    certificate:
      type: serviceConnection
      serviceConnection: "<service-connection-id>"
defaultWorkspace: business_repo         # 多代码源必填；使 PROJECT_DIR 指向业务库 checkout 目录
stages:
  review_stage:
    name: 代码评审
    jobs:
      kiro_review:
        name: Kiro 自动评审
        runsOn:                          # PoC 用公共构建集群；生产建议固定镜像 digest（见 setup-guide §7）
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        # 任务超时（必配，setup-guide §4 第 5 步）：Flow 的默认值是 240 分钟，远大于评审需要的量级。
        # 取值 = KIRO_TIMEOUT + 10 分钟（默认 900 秒 → 25）。KIRO_TIMEOUT 只包住 Kiro 调用，diff 预处理阶段
        # 目前没有自己的墙钟上限（硬上限是 Phase 2，见 docs/roadmap/diff-preprocess-resource-caps.md），
        # 并发 = 1 又是整条流水线级别，所以一个极端 MR 会占住后续所有 MR 的评审——这个超时是当前唯一的兜底。
        # 改 KIRO_TIMEOUT 时必须同步改这里。范围 1~1440 分钟。
        timeoutMinutes: 25
        steps:
          # ── 钉版档位（KIRO_INSTALL_PROFILE=pinned）专用 ────────────────────────────────
          # 在评审步骤【之前】用官方内置 OSSDownload 把 Kiro CLI 安装包从你的【私有】 OSS 桶下到执行器本地。
          # 鉴权走【服务连接（RAM）】——AK/SK 既不进本 YAML 也不进流水线环境（不变式 I10）。
          # 备包流程（云内 Cloud Shell 下载→核对 sha256→ossutil/aliyun oss cp 上传私有桶）见 setup-guide 第 9 节。
          # ★ latest 档位不需要这一步：删掉整个 oss_download 步骤，并把 UI 变量 KIRO_INSTALL_PROFILE 设为 latest。
          oss_download:
            step: OSSDownload
            name: 下载 Kiro CLI 安装包（钉版档位）
            with:
              # 首次在 YAML 编辑器粘贴后，校验器会识别 serviceConnection 并回填你组织的 ID（与 sources 里的服务连接同理）。
              serviceConnection: "<oss-service-connection-id>"
              region: "<与执行器同区域，如 cn-hangzhou>"
              bucket: "<你的私有 bucket，如 codeup-kiro-cli-0916>"
              # 桶内对象键：按 kiro/<版本>/<平台变体>.zip 组织，便于多版本并存（升级只加新对象，不动旧的）。
              sourceFilePath: "kiro/2.21.4/kirocli-x86_64-linux-musl.zip"
              # ★ OSSDownload 的真实路径语义（2026-09-16 真实流水线实测，OSSDownload v1.0.27 + ossutil 1.7.19）：
              #   targetFilePath 被当作【相对 PROJECT_DIR（业务库 checkout）的目录】，用 `ossutil cp -r` 把对象按原名下进该目录。
              #   → 填绝对路径会被剥掉前导 / 拼进业务库；填带文件名会多套一层同名目录。所以这里填【目录名】，
              #   对象最终落在 <PROJECT_DIR>/kiro-artifact/kirocli-x86_64-linux-musl.zip（在业务库内）。
              #   业务库内容不受信、评审脚本会拒绝库内的安装包路径，OSSDownload 又无法直接落到业务库之外——
              #   所以由下面 review_step 的 run 块把它 move 到业务库外的固定绝对路径，再作为 KIRO_PINNED_ARTIFACT 交给脚本。
              #   （另注：OSSDownload 对不存在的对象**不报错**、只建空目录，兜底靠 run 块的 [ -f ] 守卫。）
              targetFilePath: "kiro-artifact"
          review_step:
            step: Command
            name: 运行 Kiro 评审（脚本来自受信集成包）
            with:
              run: |
                # 钉版档位（KIRO_INSTALL_PROFILE=pinned）：oss_download 把安装包下到了业务库内（见其路径语义说明），
                # 这里把它 move 到业务库之外的固定绝对路径，再作为 KIRO_PINNED_ARTIFACT 交给脚本。latest 档位跳过这段。
                # OSSDownload 对不存在的对象不报错（只建空目录），所以 [ -f ] 守卫 = 「取不到就红、绝不放行到评审」的兜底
                # （2026-09-16 负向用例实测：坏对象 → 这里 exit 1、评审脚本不启动、不回退 curl 现装）。
                set -e
                if [ "${KIRO_INSTALL_PROFILE:-}" = pinned ]; then
                  src="$PROJECT_DIR/kiro-artifact/kirocli-x86_64-linux-musl.zip"
                  [ -f "$src" ] || { echo "钉版安装包不在预期位置：$src"; ls -RA "$PROJECT_DIR/kiro-artifact" 2>/dev/null || true; exit 1; }
                  mkdir -p /tmp/kiro-artifact && mv -f "$src" /tmp/kiro-artifact/kirocli-x86_64-linux-musl.zip
                  export KIRO_PINNED_ARTIFACT=/tmp/kiro-artifact/kirocli-x86_64-linux-musl.zip
                fi
                # 多代码源下无下标 CI_COMMIT_REF_NAME 取值不可预期（可能取到集成包分支）；
                # 用带下标变量显式指定业务库源分支与 MR 目标分支（约定见 setup-guide 第 5.1 节）。
                # 首次接入务必用 `env | cut -d= -f1 | sort`（只打变量名）核对本组织的变量名。
                export REVIEW_REPO_DIR="$PROJECT_DIR"
                export CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME_1"
                # MR_TARGET_BRANCH 用 `:=`（票 18 ④）：从 API 触发流水线并用 envs 注入它时，无条件 export 会把注入值覆盖成
                # 内置变量的取值（多代码源下那个取值可能是空的）。CI_COMMIT_REF_NAME 那行**刻意仍是无条件覆盖**：
                # 不带下标的取值可能是集成包那个代码源的分支，必须显式压掉。
                : "${MR_TARGET_BRANCH:=$CI_COMMIT_TARGET_REF_NAME_1}"; export MR_TARGET_BRANCH
                # business_repo 与 integration_repo 是兄弟目录，故用 ../ 定位集成包脚本。
                # **解释器用绝对路径**（CodeX 2026-09-13 第三轮复审）：裸 `bash` 也走 PATH，而脚本启动之前的 PATH
                # 不是脚本能管的——评审脚本自己的 PATH 门只能保证「它自己调外部工具时 PATH 可信」。
                # alinux3 与常见 Linux 发行版都有 /bin/bash；换别的镜像时改成该镜像里 bash 的绝对路径。
                # **`-p`（privileged 模式）是第四轮复审 P0 的收口**：非交互 bash 在读到脚本第一行之前就会
                # source `$BASH_ENV`（相对路径按 cwd 解析，而 cwd 是业务库），并从环境导入 exported functions
                # ——后者能顶替脚本里的 `cd`/`pwd`/`source`，甚至直接定义一个空的 `review_path_gate_or_die`
                # 让 PATH 门变成空转。`-p` 下 bash 不处理 BASH_ENV/ENV、不从环境导入函数（本机实测）。
                # 这一行前面的 `export`/`:` 都跑在 Flow 的**外层** shell 里，那个 shell 启动得更早：所以
                # 「BASH_ENV / ENV / 导出的 shell 函数不得来自业务仓库」是执行器接入要求（setup-guide 第 7 节），
                # 不是这一行能保证的。脚本自己还会在第一条命令处做一次 best-effort 检查并把 BASH_ENV/ENV 从
                # 环境里删掉（第 2 步 `curl … | bash` 拉起的子 shell 不是 privileged 的，得靠这个）。
                /bin/bash -p "$PROJECT_DIR/../integration_repo/scripts/kiro-review.sh"

# UI 中需配置的变量（变量和缓存 → 字符变量）。
# 每个开关「关闭时 / 开启时各是什么行为、前提是什么」的完整矩阵见 setup-guide 第 11 节；
# 默认全部关闭时每次评审在 MR 上发一条汇总评论（含完整问题清单）。
# 「重跑原地更新同一条汇总」需要先配 CODEUP_BOT_USERNAME，不是默认行为。
#   KIRO_API_KEY       （私密）Kiro API Key
#   YUNXIAO_TOKEN      （私密）云效令牌，建议专用机器人账号（代码只读 + MR 读写）
#   YUNXIAO_ORG_ID     云效组织 ID
#   CODEUP_REPO_ID     业务代码库数字 ID
#   DIFF_SIZE_LIMIT    可选，默认 307200（300KB）。**只是提示词预算**：不限制原始 diff 总量、磁盘、变更文件数与
#                      预处理时间（超限时脚本仍把整份 diff 落盘、逐文件生成 chunk），KIRO_TIMEOUT 也不包住这段预处理；
#                      并发 = 1 下一个极端 MR 会占住整条流水线，务必给任务配超时（setup-guide 第 4 节第 5 步）。
#                      硬上限（文件数 / 原始字节 / 单 chunk / 预处理墙钟）是 Phase 2 backlog（docs/roadmap/diff-preprocess-resource-caps.md）
#   KIRO_INSTALL_PROFILE **必配，无默认值**（ADR-0006）。安装档位：`latest` = 官方安装脚本现装（只装最新版，版本不受控，
#                      被版本门拒绝是该档位的稳态行为）；`pinned` = 安装包由流水线预先备好在本地路径上、脚本核对两个摘要后安装。
#                      **缺失即拒绝评审**——刻意不给缺省值：靠「某个来源变量是否非空」推断档位时，变量名拼错会静默落回现装最新版，
#                      然后被版本门拒绝，错误信息指向 Kiro 版本而真实原因是拼错的变量名。**这是运维可见的行为变更**：
#                      升级到本版本之前必须先在 UI 里配好它，否则每次评审都会以「缺少 KIRO_INSTALL_PROFILE」失败
#   KIRO_PINNED_ARTIFACT 钉版档位**必配**：安装包在执行器上的**绝对路径**，且必须在业务仓库之外（业务库内容不受信，
#                      落在库内会被拒绝运行）。评审脚本只认这个本地路径、不知道文件怎么来的（自建执行器烤进镜像时同一套脚本不用改）。
#                      **本参考不把它配成 UI 变量**：OSSDownload 只能把对象下到业务库内（见 oss_download 的路径语义），所以由
#                      review_step 的 run 块把包 move 到业务库外的 /tmp/kiro-artifact/ 后 `export KIRO_PINNED_ARTIFACT` 指向它。
#                      若你的执行器/下载方式能直接把包放到业务库外的固定绝对路径，可省掉 move、把它配成 UI 变量
#   KIRO_PINNED_ARTIFACT_SHA256 钉版档位**必配**。**安装包本身**的 64 位十六进制 SHA-256，核对「拉到的字节对不对」，
#                      在解压之前核对。与 KIRO_CLI_SHA256（核对「装完之后被执行的那个文件」）**不是同一个数**，两个都要配：
#                      官方按版本直链不发布校验和（`stable/<版本>/manifest.json` 返回 403），这两个摘要是钉版安装唯一的完整性依据。
#                      集成包随每个已探测元组一起发布这两个值
#   KIRO_TIMEOUT       可选，默认 900（秒）
#   KIRO_CLI_SHA256    可选，默认空；**生产必配**。kiro-cli 入口文件（command -v kiro-cli 解析符号链接后）的 64 位 SHA-256，
#                      取值在构建执行器镜像时记录（setup-guide 第 7 节）。脚本在第一次执行 kiro-cli 之前核对，不一致拒绝评审。
#                      版本门只挡版本语义漂移，这一项才是 ADR-0004 要求的二进制完整性钉死；未配置时只留日志、不核对
#   KIRO_ACK_UNTESTED_TARGET 可选，默认空。执行器上的「<os>/<arch>:<kiro-cli 版本>」不在脚本 KIRO_TESTED_TARGETS
#                      名单内时脚本**拒绝评审**并回写「评审未完成」（读取边界依赖在该平台该版本上实测的行为；
#                      云托管执行器 curl|bash 装的是 latest，Kiro 升级后就会这样）。确需在该组合上运行，把它设成与
#                      本次组合逐字相同的元组（如 linux/x86_64:2.22.0）临时放行，汇总评论带醒目 notice；
#                      探测通过、组合进名单后删掉。不是布尔开关，不匹配仍拒绝。
#                      旧的 KIRO_ACK_UNTESTED_VERSION（只绑版本）**已废弃**：设了会直接拒绝运行——它设过一次就会在
#                      执行器换平台后继续放行同一个版本
#   KIRO_TESTED_TARGETS_EXTRA 可选，默认空。空格分隔的「<os>/<arch>:<版本>」元组，登记**你自己探测过**的组合，
#                      与脚本里的 KIRO_TESTED_TARGETS 取**并集**：加得进来，但删不掉、也覆盖不了集成包已验证的那些。
#                      它让升级仪式不必再改集成包源码（否则只能 fork 或长期靠 break-glass 顶着）。
#                      **与 KIRO_ACK_UNTESTED_TARGET 的区别就是语义**：本变量 = 「这个组合我按 scripts/probe/README.md
#                      跑过探测且全 PASS」，放行时**不带 notice**；KIRO_ACK_UNTESTED_TARGET = 「谁都没探测过、我自担风险」，
#                      放行时汇总带醒目 notice。没跑探测就往本变量里加元组，等于悄悄关掉版本门——它安静，所以更该守规矩。
#                      任一项形状不合法即拒绝运行（取值不回显）；本次元组由哪个来源授权只写流水线日志、不进 MR 评论
#   MAX_COMMENT_BYTES  可选，默认 60000（字节）
#   CODEUP_BOT_USERNAME 可选但强烈建议，机器人账号在 Codeup 上的用户名。
#                      未配置且令牌身份接口不可用时：汇总评论每次新建（不原地更新）；INLINE_COMMENT=1 也整轮
#                      不发行内评论、汇总退回完整问题清单（防止他人伪造隐藏标记压制问题；setup-guide 第 11 节）；
#                      取值照抄首次运行日志里「新建评论的作者用户名=…」那一行
#   INLINE_COMMENT     可选，默认 0（关）。1 = 可定位的问题发成行内评论、汇总退化为状态面板 +
#                      折叠区；其它取值拒绝运行。开启前提：执行器有 sha1sum 或 shasum
#   INLINE_PROFILE     可选，默认 quiet（P0+P1 可发行内）；balanced=全部；critical=仅 P0。
#                      非法取值回落 quiet 并在汇总评论里说明
#   MAX_INLINE_COMMENTS 可选，默认 10（单次行内评论上限，超出的进折叠区；0 = 全部进折叠区）。
#                      非法取值回落 10 并在汇总评论里说明
#   REVIEW_RERUN_HINT  可选，默认「重跑流水线可重新评审」。页脚与降级提示里「怎么重新评审」那句话；
#                      Flow 档位接不到评论事件，所以默认不写 /kiro review（AWS 档位才设成评论命令）
#   MR_LOCAL_ID        可选，MR 编号（与 MR_TARGET_BRANCH 必须同时设置才生效；
#   MR_TARGET_BRANCH   可选，目标分支  未设置时脚本按源分支反查 OpenAPI，见指南第 5 节）
#
# 注意 KIRO_TIMEOUT 与 DIFF_SIZE_LIMIT 只接受纯数字（15m / 300KB 这类写法会被拒绝运行）。
# 另有一组只给测试与排障用的变量（DRY_RUN、DRY_RUN_FIXTURE_DIR、DRY_RUN_FAIL_ROUTES、
# PROMPT_FILE、CODEUP_RETRY_BACKOFF、CODEUP_COMMENT_PAGE_HINT、CODEUP_API_BASE）——
# 生产流水线一个都不要配，逐条后果见 setup-guide 第 11.2.1 节。
